
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maze Runner — WebAssembly Edition</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ═══ BACKGROUND GRID ═══ -->
  <div class="bg-grid" aria-hidden="true"></div>

  <!-- ═══ MAIN WRAPPER ═══ -->
  <div class="wrapper">

    <!-- ── HEADER ── -->
    <header class="site-header">
      <div class="logo">
        <span class="logo-icon">⬛</span>
        <h1>MAZE<span class="accent">RUNNER</span></h1>
      </div>
      <p class="tagline">Compiled in C · Powered by WebAssembly</p>
    </header>

    <!-- ── SETUP PANEL ── -->
    <section class="panel setup-panel" id="setupPanel">
      <h2 class="panel-title">New Game</h2>

      <div class="difficulty-group">
        <label class="diff-label">Difficulty</label>
        <div class="diff-buttons">
          <button class="diff-btn active" data-level="0">
            <span class="diff-name">Easy</span>
            <span class="diff-size">9 × 9</span>
          </button>
          <button class="diff-btn" data-level="1">
            <span class="diff-name">Medium</span>
            <span class="diff-size">15 × 15</span>
          </button>
          <button class="diff-btn" data-level="2">
            <span class="diff-name">Hard</span>
            <span class="diff-size">21 × 21</span>
          </button>
        </div>
      </div>

      <button class="btn-primary" id="startBtn">
        <span class="btn-text">START GAME</span>
        <span class="btn-arrow">→</span>
      </button>

      <div class="wasm-badge">
        <span class="wasm-dot"></span>
        WebAssembly Module Ready
      </div>
    </section>

    <!-- ── GAME PANEL ── -->
    <section class="panel game-panel hidden" id="gamePanel">

      <!-- HUD -->
      <div class="hud">
        <div class="hud-item">
          <span class="hud-label">MOVES</span>
          <span class="hud-value" id="moveCount">0</span>
        </div>
        <div class="hud-item hud-center">
          <span class="hud-label" id="diffLabel">EASY</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">TIME</span>
          <span class="hud-value" id="timer">0.0s</span>
        </div>
      </div>

      <!-- Canvas -->
      <div class="canvas-wrapper">
        <canvas id="mazeCanvas"></canvas>
      </div>

      <!-- Controls hint -->
      <div class="controls-hint">
        <span>↑ ↓ ← →</span> Arrow keys &nbsp;|&nbsp;
        <span>W A S D</span> WASD &nbsp;|&nbsp;
        <span>Tap</span> on-screen buttons
      </div>

      <!-- Mobile D-Pad -->
      <div class="dpad" id="dpad">
        <button class="dpad-btn" id="btnUp"   aria-label="Up">▲</button>
        <div class="dpad-row">
          <button class="dpad-btn" id="btnLeft"  aria-label="Left">◀</button>
          <div class="dpad-center"></div>
          <button class="dpad-btn" id="btnRight" aria-label="Right">▶</button>
        </div>
        <button class="dpad-btn" id="btnDown"  aria-label="Down">▼</button>
      </div>

      <!-- Restart -->
      <button class="btn-secondary" id="restartBtn">↺ RESTART</button>
    </section>

    <!-- ── LEGEND ── -->
    <div class="legend" id="legend" style="display:none">
      <span class="leg-item"><span class="leg-swatch player-swatch"></span>You (P)</span>
      <span class="leg-item"><span class="leg-swatch exit-swatch"></span>Exit (E)</span>
      <span class="leg-item"><span class="leg-swatch wall-swatch"></span>Wall</span>
      <span class="leg-item"><span class="leg-swatch path-swatch"></span>Path</span>
    </div>

  </div><!-- /wrapper -->

  <!-- ═══ WIN POPUP ═══ -->
  <div class="overlay hidden" id="winOverlay">
    <div class="win-card">
      <div class="win-trophy">🏆</div>
      <h2 class="win-title">YOU ESCAPED!</h2>
      <div class="win-stats">
        <div class="win-stat">
          <span class="ws-label">Moves</span>
          <span class="ws-value" id="winMoves">—</span>
        </div>
        <div class="win-stat">
          <span class="ws-label">Time</span>
          <span class="ws-value" id="winTime">—</span>
        </div>
        <div class="win-stat">
          <span class="ws-label">Level</span>
          <span class="ws-value" id="winLevel">—</span>
        </div>
      </div>
      <div class="win-actions">
        <button class="btn-primary" id="winRestartBtn">Play Again</button>
        <button class="btn-secondary" id="winMenuBtn">Main Menu</button>
      </div>
    </div>
  </div>

  <!-- ── WebAssembly glue (generated by Emscripten) ── -->
  <script src="maze.js"></script>
  <!-- ── Game logic ── -->
  <script src="game.js"></script>

</body>
</html>
